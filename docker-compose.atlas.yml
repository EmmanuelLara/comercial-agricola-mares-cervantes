services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mares_app_atlas
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://usuario:password@cluster0.xxxxx.mongodb.net/comercial_agricola_db?retryWrites=true&w=majority}
      - JWT_SECRET=${JWT_SECRET:-ares_secret_key_2024}
    env_file:
      - .env
